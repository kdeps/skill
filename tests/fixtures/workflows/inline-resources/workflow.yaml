apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: skill-test-inline
  version: "1.0.0"
  description: Skill fixture — inline resources in workflow.yaml
  targetActionId: respond

deploy:
  apiServer:
    portNum: 17614
    routes:
      - path: /api/v1/inline
        methods: [GET]
  runtime:
    timezone: UTC

resources:
  - actionId: run
    name: Inline Exec
    component:
      name: exec
      with:
        command: "echo '{\"inline\":true}'"
        timeout: 10s

  - actionId: respond
    name: API Response
    flow:
      requires: [run]
    apiResponse:
      success: true
      response:
        output: get('run')