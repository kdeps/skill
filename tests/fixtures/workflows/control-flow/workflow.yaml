apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: skill-test-control-flow
  version: "1.0.0"
  description: Skill fixture — items iteration and before expressions
  targetActionId: respond

deploy:
  apiServer:
    portNum: 17619
    routes:
      - path: /api/v1/flow
        methods: [GET]
  runtime:
    timezone: UTC

resources:
  - actionId: process
    name: Process Items
    flow:
      items:
        - alpha
        - beta
        - gamma
    component:
      name: exec
      with:
        command: 'printf "%s\n" "{{ get(''current'') }}"'

  - actionId: respond
    name: API Response
    flow:
      requires: [process]
    before:
      - set('count', len(get('process')))
    apiResponse:
      success: true
      response:
        itemCount: get('count')