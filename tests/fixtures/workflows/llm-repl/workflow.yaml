apiVersion: kdeps.io/v1
kind: Workflow

metadata:
  name: skill-test-llm-repl
  version: "1.0.0"
  description: "Skill fixture - interactive input source with a repl prompt and sessionId"
  targetActionId: chat

deploy:
  input:
    sources: [interactive]
  runtime:
    timezone: UTC
    installOllama: true
repl:
  prompt: "You: "
  sessionId: skill-llm-session